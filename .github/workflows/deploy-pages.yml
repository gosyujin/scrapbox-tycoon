name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pages/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Stage dist and cache-bust asset URLs
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css dist/
          cp -r js dist/
          cp build-info.json dist/
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/css\/style.css\"/css\/style.css?v=$SHA\"/" dist/index.html
          sed -i "s/js\/app.js\"/js\/app.js?v=$SHA\"/" dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
